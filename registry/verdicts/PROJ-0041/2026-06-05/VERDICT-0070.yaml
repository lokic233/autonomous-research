key_structural_finding: 'MECHANISM-NOVELTY DEAD (gate-4): the loud-vs-silent-by-LOCATION
  asymmetry is documented WAL-format-family behavior -- RocksDB WAL Recovery Modes
  PARAMETERIZES exactly this (kPointInTimeRecovery = stop-at-first-corruption/open-clean/discard-rest;
  tail-tolerant vs absolute-consistency), a configurable API in a mature peer; LevelDB
  log_reader same shape (truncated->EOF, checksum->error). >=2-source collision, anti-hallucination
  satisfied. DURABILITY-BOUNDARY = HARD CAP (stress-test B, decisive+unrebutted):
  if SyncAll fsync completed for batch N+1, POSIX guarantees batch N on stable storage
  -> the reorder-SIM''s zeroed-interior-page+valid-subsequent-data state is UNREACHABLE
  via OS crash on barrier-honoring hardware -> the ''12 SyncAll-acked keys silently
  discarded'' is an INJECTION ARTIFACT, not a crash vuln. The only REAL crash evidence
  (dm-flakey) drops un-fsync''d Buffer data (writer.rs:232 no-op) = contractually-ALLOWED
  loss = contract working as specified. WHAT SURVIVES (narrower, un-owned, actionable):
  fjall 3.1.4 HARDWIRES the silent-truncate-on-framing-corruption as the ONLY recovery
  mode, with NO AbsoluteConsistency opt-out + NO error surface, with a clean discriminating
  control (in-data->loud). = an INSTANTIATION of a known phenomenon in one real young
  system (un-owned in fjall: #53 cosmetic, #112/#113 different fixed bug, no CVE/Jepsen/paper)
  -- worth a fjall issue/advisory, NOT a publishable novel finding without reframe
  + prior-art + L1.'
disposition: 'committee#1 UNANIMOUS 6/6 YELLOW (no RED). Both orchestrator-flagged
  stress-tests RESOLVED AGAINST the strong form: (A) mechanism-novelty DEAD (documented
  WAL-family behavior; RocksDB parameterizes it), (B) durability-contract boundary
  is the HARD CAP (POSIX barrier makes the reorder-sim''s post-fsync silent-loss state
  unreachable via real crash; dm-flakey only drops un-fsync''d Buffer = contractually-allowed
  loss). Survives as a narrower un-owned finding. Gate to a heavy L1 (dm-log-writes
  + peer-LSM differential) OR converge.'
