fatal_objections:
- "STRAWMAN BASELINE (fatal, 3 reviewers independent): the claim premises 'document-level\
  \ near-dedup is the standard contamination practice' \u2014 FALSE. GPT-3 (Brown\
  \ 2020) uses 13-gram overlap"
- "PaLM (Chowdhery 2022) uses 8-gram >=70% containment. Standard contamination detection\
  \ IS ALREADY passage/n-gram-level. Document-level Jaccard near-dedup is a CORPUS-DEDUP\
  \ tool (different task). '0% reported vs true 20%' compares a corpus-dedup tool\
  \ vs a contamination-detection tool \u2014 a category error, not a gap"
- "ALGEBRAIC TAUTOLOGY: the ~100% miss gap is closed-form \u2014 Jaccard(doc,item)~s/(s+D)=span_ratio\
  \ for disjoint vocab"
- 50-in-500 ~0.09 < any threshold. RESULTS.md derives 43/490~0.09 then 'measures'
  exactly that. Confirming textbook set-arithmetic to 3 decimals = calibration, not
  discovery
- "MISSING CONTAINMENT BASELINE (killer exp): Containment=|A&B|/|item| yields 1.0\
  \ for any fully-embedded item regardless of doc length \u2014 trivially closes the\
  \ gap. Omitting it inflates apparent novelty"
- the result shows only that ONE doc-level metric (union-Jaccard) is blind, which
  is analytically predicted
- "FULL PRIOR-ART OCCUPATION (>=2 sources): Lee 2021 (2107.06499) introduced NearDup-vs-ExactSubstr\
  \ PRECISELY because doc-level near-dedup misses short shared substrings \u2014 the\
  \ mechanism IS the published motivation. Paraphrase fragility = Yang 2023 (2311.04850)"
- 2024 surveys (Xu 2406.04244, Ravaut 2404.00699) taxonomize string/n-gram vs embedding
  + paraphrase fragility. Every axis (mechanism, rate-distortion, paraphrase boundary)
  occupied
required_evidence:
- "None terminal \u2014 strawman premise (real contamination detection already uses\
  \ passage/n-gram, not doc-level Jaccard) + algebraic tautology + omitted Containment\
  \ baseline that trivially closes the gap + full prior-art occupation (Lee 2021 ExactSubstr\
  \ is the direct antecedent). The one novel bit (precision boundary @span_thresh0.95\
  \ under partial-quote confound) is a calibration knob, not the foregrounded claim,\
  \ synthetic-only, insufficient for a 'granularity gap' contribution."
