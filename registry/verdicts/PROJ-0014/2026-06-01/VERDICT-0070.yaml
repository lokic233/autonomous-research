verbatim_votes_summary: |
  KILL RATIFIED. Reviewers 4 RED + 1 YELLOW; area_chair FINAL_VERDICT: kill. Aggregated on SUBSTANCE (the lone yellow is citation-framing, NOT evidence any cheap policy captures the gap). No fabrication.
  - novelty_killer (claude-opus-4-8) YELLOW (citation-fixable, NOT an objection to the kill): web-search permission-blocked -> cannot assert a >=2-source verified collision -> per anti-coping cannot vote RED. Mechanisms are HONESTLY prior art (ARC/LRU-K/LFU/SLRU run verbatim, no naming-novelty fraud). The bare result is at worst-case a corollary of Sleator-Tarjan 1985 k-competitiveness -> paper MUST foreground the workload-specific magnitude (<=11% gap, anti-correlated capture <=0.31 at frac 0.1-0.3) + cite LRB/NSDI'20 (learned-Belady DOES close the CDN gap -> agent-KV negative is workload-specific) + H2O/SnapKV. "Honest negative is publishable; novelty concerns fixable-by-citation, hence yellow not red."
  - systems_reviewer (codex) RED: premise reproduced (far_share 0.188, Belady max 11.0%); killer baselines RUN + FAIL (ARC 0/5, LRU-K(2) 0/5, SGLang-LFU 0/5 + worse than LRU at tight caps); FIX-5 honored (pin charged to C, lone >=0.50 pin cell at frac 0.7 on 0.6%-of-LRU gap, 0/15 cells survive BH/Bonferroni). vLLM/SGLang/TensorRT-LLM already ship these mechanisms -> an actionable negative systems insight supporting ship-LRU.
  - evaluation_prosecutor (gemini) RED: evaluation avoids strawmen by integrating the strongest classical killer baselines ARC + LRU-K which CLEANLY FAIL (0/5 caps >=0.50); FIX-5 matched residency isolates policy advantage from capacity inflation; statistically robust (HHI 0.08, BH/Bonferroni cleared). Ratify RED (kill) for a clean actionable negative: ship plain LRU. (Flagged LIRS not run -> chair: non-blocking, ARC subsumes it + fails 0/5.)
  - theory_skeptic (claude-opus-4-7) RED (endorses kill conditionally): mechanism story (gap oracle-only) plausible + evidence consistent with mundane explanation (small <=11% headroom + ill-conditioned capture metric near compulsory-miss floor). RED-until robustness caveats: (a) LRU-K K-sweep {2,3,4} (only K=2 run); (b) per-cap HHI + CIs on 0/5 killer counts; (c) sensitivity at 40%-capture/2-of-5 thresholds; (d) explicit acknowledgement kill is conditional on slot-count (not mass) capacity unit. NOTE: these are robustness ceilings, not a claim that a cheap policy captures the gap -> substantively endorses the kill.
  - product_realist (metacode) RED: production deployments run at higher residency where absolute Belady win is <3%; SGLang-LFU actively harmful at tight caps; ship-LRU is the actionable guidance. (vote red x2 in output, identical rationale.)
  - area_chair (claude-opus-4-6) FINAL_VERDICT: kill. Resolved theory_skeptic's 4 conditions as NON-BLOCKING: (a) ARC adaptively subsumes LRU-K's recency-freq tradeoff + also fails 0/5 -> K-sweep reaching 3/5 implausible (LRU-K(2) captures 0.189/-0.044/-0.065 at frac 0.1-0.3); (b) 0/15 cells surviving multiplicity is the binding constraint not per-cap HHI; (c) at 40%/2-of-5 only 1 cell crosses reliably -> result doesn't flip; (d) slot-count capacity is a documented harness ceiling inherited from accepted EXP-0057, MUST be stated in write-up. novelty_killer yellow resolved by mandatory citations (Sleator-Tarjan 1985, LRB/NSDI'20, H2O/SnapKV). PRIOR_ART_ADEQUATE=no is a PROCESS gap (blocked web search), NON-BLOCKING for a kill (the "no green without prior-art" rule guards promotion, not ratifying a well-evidenced negative). The kill stands on the captured-fraction matrix.
key_structural_finding: |
  ANTI-CORRELATION between capture and gap-size: where the Belady gap matters (cache frac 0.1-0.3, gap 6.4-11.0% of LRU) every cheap classical policy captures <=0.31 of it and SGLang-LFU is actively HARMFUL (-0.747 at frac 0.1); where cheap policies approach >=0.50 capture (frac 0.7) the entire gap is only 0.6% of LRU (operationally negligible). Tight-cache eviction needs future-step knowledge, not recency/frequency statistics.
disposition: KILL RATIFIED -> DEAD-0025. Agent-KV Belady gap is ORACLE-ONLY, closed from BOTH predictor (DEAD-0019/EXP-0057) and policy (this) sides. SURVIVOR: PROJ-0011 bimodality+LRU-suboptimality characterization STANDS. PROJ-0014 -> converged.
