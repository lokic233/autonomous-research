fatal_objections:
- "MECHANISM OCCUPIED (>=2 independent sources): Chroma Research 'Evaluating Chunking\
  \ Strategies for Retrieval' (2024) built token-level recall/IoU/Precision_Omega\
  \ PRECISELY BECAUSE relevant excerpts split across chunks \u2014 the exact mechanism"
- completeness@k is a thresholded binary special case of their CONTINUOUS token-level
  recall. Joren et al 'Sufficient Context' (2411.06037, ICLR 2025) formalizes recall-hit
  != answerable. Collision at KILL bar
- 'TAUTOLOGICAL IDENTITY not empirical: recall@k pinned at 1.000 in every cell by
  construction (unique gold tokens -> lexical retriever always ranks fragment top-1)
  so over-count == split_rate BY DEFINITION'
- split_rate is closed-form combinatorial P(split)~max(0,(span_len-overlap-1)/(chunk_size-overlap)).
  The exp re-derives its own definitions under a degenerate retriever
- the '96.5pt distortion' is the worst case of this artifact
- "BASELINE NOT UNIVERSAL (partially valid): '>=1 token overlap = hit' is ONE reasonable\
  \ definition but NOT the universal standard claimed \u2014 open-domain QA eval (DPR\
  \ Karpukhin 2020, NQ, DrQA) defines a hit as passage CONTAINS the full answer string,\
  \ i.e. already containment/completeness-flavored for short answers"
