key_structural_finding: 'The loud-vs-silent asymmetry is well-demonstrated and the
  L0 is clean. BUT the committee identified a CHEAPER discriminator not yet run: if
  DuckDB''s CAST layer itself silently truncates floats to int (standard SQL lossy-cast
  behavior), then the sniffer merely inferred a type and the cast did what casts do
  -> the novelty collapses to ''known SQL cast + sample inference, known-hazard instance.''
  The sniffer contract-violation framing survives ONLY if the cast layer alone would
  NOT truncate (or would error) -- making the sniffer''s silent-type-commitment the
  load-bearing novel step.'
disposition: 'committee#1 YELLOW (6/6, no RED). Gates on a CHEAP decisive probe: does
  CAST(3.14 AS BIGINT) silently truncate? If yes -> the asymmetry is in the CAST LAYER
  (known SQL behavior) -> YELLOW-terminal. If no (cast throws) -> sniffer-specific
  anomaly -> upgrades toward L1.'
