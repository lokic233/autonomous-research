fatal_objections:
- "PRIOR-ART COLLISION with FOUNDATIONAL hubness theory (>=2 sources, unrebutted):\
  \ the confirmed half ('low reverse-kNN in-degree -> elevated per-item FN, density-independent')\
  \ collides with Radovanovic Nanopoulos Ivanovic 2010 (JMLR 11:2487-2531) which DEFINES\
  \ N_k=reverse-kNN count, establishes ANTI-HUBS (low N_k) as systematically under-retrieved,\
  \ and shows hubness is NOT a density artifact \u2014 the exact surviving claim restated\
  \ for graph-ANN. Corroborated Schnitzer 2012 JMLR + the packet's own 2412.01940.\
  \ Prior-art search INADEQUATE (omitted the 2010/2012 foundational literature, argued\
  \ novelty only vs narrow recent 2510.22316/2405.17813/2412.01940) -> per chair rules\
  \ GREEN blocked on inadequate prior-art"
- "the NOVEL half ('a STABLE SUBSET of vectors') FAILED its own pre-registered threshold\
  \ (stability Spearman 0.134<0.30, 0.079 at denom>=5) \u2014 what survived is most\
  \ anticipated by prior art, what died is what would have been new"
- "the mechanism delta (built-graph in-degree vs data-level reverse-kNN N_k) was NEVER\
  \ MEASURED \u2014 in single-flat-layer NSW at N=4000 they're expected tightly coupled,\
  \ so the predictor is not shown distinct from the classical hubness predictor"
required_evidence:
- "Reformulation needed (a different, not-yet-run claim): (1) measure corr(built-graph\
  \ in-degree, data-level N_k) + show the RESIDUAL (in-degree after partialling out\
  \ N_k) still predicts per-item FN \u2014 the ONLY viable delta over Radovanovic\
  \ 2010"
- "(2) degree-preserving random-graph null (rewire preserving degree seq) \u2014 if\
  \ the partial survives, it's trivial reachability arithmetic not a topological signature"
- (3) partial controlling for denom/exposure (low in-degree -> smaller denom = rate-estimator
  confound)
- "(4) ef_search sensitivity {10,16,24,32} \u2014 does the slope collapse as width\
  \ grows (search-width artifact?)"
- "(5) production multi-layer HNSW on high-intrinsic-dim real embeddings (SIFT1M d>=128)\
  \ \u2014 the L0 regime (d=12,N=4000,flat) is where hubness is WEAK."
