summary: 'L1 decisive: residual FN rate (model-identical dups missed AFTER production
  dedup normalization) on a real multilingual corpus. Real production dedup defaults
  (datatrove simplify_text lowercase+NFD-diacritic-strip+punct-removal OR text-dedup
  preprocess lowercase+non-word-split) x real model tokenizer (SentencePiece NFKC+casefold
  or HF normalizer). GREEN gate: residual FN >=1pct of model-identical pairs -> GREEN;
  <0.1pct -> RED (toothless). Also: NFKC-compatibility-only pair prevalence, word/BPE-shingle
  sensitivity, partial-coupling regime. Cite IIR sec2.2 normalization-mismatch as
  the general principle.'
