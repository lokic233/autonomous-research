original_claim: For agentic LLM serving with bursty per-session KV pressure, a tiered
  KV-offload policy that proactively demotes a session's COLD prefix blocks to CPU/host
  memory (and prefetches them back on the session's next turn, overlapping fetch with
  the inter-turn idle gap) achieves a strictly better effective-batch-size / TTFT
  Pareto than evict-and-recompute, because agent inter-turn gaps are long enough to
  hide PCIe fetch latency AND the demoted blocks are re-referenced with high probability
  on resume.
