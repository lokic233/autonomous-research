original_claim: "In multi-agent LLM systems, an EXTRACTIVE inter-agent message compressor\
  \ that keeps only the spans the RECEIVING agent will actually act on (predicted\
  \ from the receiver's role+task, NOT the full message) cuts total multi-agent token\
  \ cost by a non-trivial fraction at matched task-success, AND beats BOTH (a) recency/length\
  \ truncation and (b) a generic role-agnostic prompt compressor (LLMLingua-style)\
  \ at matched compression ratio \u2014 because inter-agent messages carry role-irrelevant\
  \ verbosity that a receiver-role-conditioned filter can drop but a generic compressor\
  \ cannot."
