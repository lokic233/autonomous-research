original_claim: "Tool-boundary acceptance cliff: on agentic tool-calling trajectories,\
  \ a speculative-decoding draft model's token-acceptance rate drops a measurable,\
  \ position-localized amount in the K=8 decode steps immediately after each tool-result\
  \ injection (resumption boundary), and this boundary penalty is a distinct within-trajectory\
  \ driver of accepted-length variance that SURVIVES (a) a content-type-matched null,\
  \ (b) the generic non-tool context-shift penalty, (c) conditioning on local target-model\
  \ entropy, and (d) task-domain partialling (2510.02128) \u2014 i.e. it is a position-from-boundary\
  \ effect, not content-type/entropy/domain."
