original_claim: "For multi-turn agentic LLM serving under cache pressure, an adaptive\
  \ 3-class KV/prefix retention policy that distinguishes COMMITTED-conversation scratch\
  \ (appended to running context, reused by later turns) from TRANSIENT scratch (one-shot\
  \ tool payloads never re-referenced) and protects a hot-prefix FLOOR, achieves a\
  \ strictly better hit-rate/recompute Pareto frontier than (a) plain LRU and (b)\
  \ a pin-shared-prefix-only baseline across the full cache-capacity sweep AND across\
  \ shared_prefix_frac in {0.25,0.5,0.75,0.9} \u2014 i.e. the win does NOT collapse\
  \ to trivial shared-prefix pinning and does NOT invert with cache headroom."
reason_killed: 'Real-system GPU L1 REFUTES adaptive3: under real prefix-chained KV
  caching + real vLLM 0.22 on H100, tool-boundary classifier yields 0 gain over LRU
  (max +0.33pp in unrealistic flat regime; -19pp at tight cap due to prefix-chain
  breakage). LRU==Belady (recency optimal on monotonic agentic transcripts). Scan-resistant
  baseline confirms classifier empty. L0 win was flat-cache+oracle artifact. Honest-negative
  branch triggered. Closest prior art Continuum(2511.02230).'
