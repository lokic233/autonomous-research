claim: "In long-horizon agent memory systems, the write path WRITE-AMPLIFIES \u2014\
  \ a non-trivial fraction (>25%) of memory writes are semantically REDUNDANT (the\
  \ agent re-stores a fact equivalent to one already in its store, because writes\
  \ are not deduplicated) \u2014 AND a cheap pre-write semantic-dedup gate (embed-and-near-dup-check\
  \ the candidate write against existing memories, NO LLM call) cuts memory-store\
  \ GROWTH by a non-trivial fraction at MATCHED downstream task-recall, beating BOTH\
  \ (a) no-dedup append-everything AND (b) a recency/size-cap eviction baseline at\
  \ matched store size \u2014 because redundant re-stores are common and detectable\
  \ pre-write, and a size-cap (which evicts by age, not content) discards still-needed\
  \ old memories that dedup would have kept."
why_it_matters: "FRESH AREA (retrieval-and-memory \u2014 first claim in the expanded\
  \ topic-bias). LIGHTWEIGHT: one sharp claim. Screened vs all 3 anti-patterns: NOT\
  \ a tuned-knob (it's a structural dedup-vs-evict comparison), NOT KV-reuse, NOT\
  \ predictor-vs-own-logprob (the dedup signal is content-overlap of stored memories,\
  \ not the model's confidence about an outcome). Two falsifiable parts: (1) measurable\
  \ write-amplification rate (>25% redundant re-stores) in long-horizon agent-memory\
  \ traces; (2) does cheap pre-write dedup cut growth at MATCHED recall, beating no-dedup\
  \ AND size-cap-eviction? L0: model agent-memory write streams w/ latent redundancy\
  \ + a content-overlap dedup gate vs no-dedup vs size-cap, measure growth + task-recall\
  \ at matched store size; anti-circular (gate reads content overlap, not the dup\
  \ label); honest-negative if amplification low OR dedup loses recall OR size-cap\
  \ already wins. Topic: retrieval-and-memory. Distinguish from RAG dedup / dedup\
  \ in datastores (those dedup RETRIEVAL corpora; this is the agent's WRITE path)\
  \ + memory systems (MemGPT/Letta, Generative Agents reflection) \u2014 novelty is\
  \ the empirical write-amplification characterization + pre-write dedup vs size-cap\
  \ at matched recall."
