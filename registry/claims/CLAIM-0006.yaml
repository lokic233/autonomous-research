  summary: 'CPU token-proxy cost-surface (100 cells x3 reps). Reproduced ~2% anchor
    (CTX=4000,inj=40: 2.0-2.4%). Full surface: min0.02/median1.34/max53.05% recompute.
    LAW: recompute% tracks injection_tokens/seq_len (slope~1), NOT edit position (position
