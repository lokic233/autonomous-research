claim: "For agent tool-result re-ingestion, a template-structured KV reuse scheme\
  \ that caches KV for the FIXED-SCHEMA token positions of a tool's result envelope\
  \ (recomputing only the variable value spans) reclaims strictly more reusable KV/prefill\
  \ than exact-prefix caching (vLLM APC / RadixAttention) on realistic agent traffic\
  \ where the SAME tool returns the SAME schema with DIFFERENT values \u2014 because\
  \ exact-prefix caching breaks at the first differing value token while the schema\
  \ positions are bytewise-identical AND (the load-bearing test) the fixed-schema\
  \ KV is position-stable enough to reuse OR cheaply re-anchored, a STRUCTURAL reuse\
  \ a tuned exact-prefix policy cannot capture by construction."
why_it_matters: "NEW axis + deliberately a STRUCTURAL/discrete win (NOT the Jensen-floor\
  \ adaptive-knob shape that killed EXP-0006/0011/0027). Two falsifiable parts: (1)\
  \ is there material schema-identical-value-differing structure in real tool-result\
  \ traffic that exact-prefix caching misses? (2) is the fixed-schema KV actually\
  \ reusable given RoPE position-dependence (the EXP-0007 reality that killed CDC\
  \ dedup) \u2014 i.e. are schema tokens at stable positions, or cheaply re-anchorable?\
  \ L0: measure schema-reuse-beyond-exact-prefix on agent tool-result traces + confront\
  \ position-dependence honestly; honest-negative if exact-prefix already captures\
  \ it OR RoPE position-shift kills reuse (like EXP-0007). Must beat REAL APC/RadixAttention,\
  \ not a strawman. Topic: kv-cache + agent-infra. Distinguish from EXP-0007 (CDC\
  \ dedup, died on RoPE) + Prompt Cache/CacheBlend (modular reuse) \u2014 novelty\
  \ is the TOOL-RESULT-SCHEMA-template structure specifically + whether it survives\
  \ position-dependence."
