    SURVIVES). TEST2 (monitorability): semantic LLM-as-judge monitor on the 7B misroutes
    RECALL=1.0 CI[.954,1.0] (neutral framing 0.9125; control yes-on-correct 0.675,
    non-degenerate) -> a non-trivial semantic monitor CATCHES the near-miss misroutes
    -> MONITORABILITY-COLLAPSE LEG IS FALSIFIED on capable models (only a syntactic
    schema-validator is blind). CAPABILITY INVERSION: the two legs never co-occur
    on one model -- weak 0.5B has monitor recall 0.0 but its unconstrained base already
    misroutes 0.9125 (constraint not causal there). Per pre-reg STOP rule (Tests3-5
    only if 1+2 both survive), STOPPED after Test2 -- no Test3-4. Disposition WEAKEN:
    support-removal coercion is real+causal; the safety/monitorability story is overstated.
    NOT green-track. Test5 prior-art: could not certify novelty offline -- flag for
    committee#2 w/ web.'
