supporting_evidence:
- exp_id: EXP-0019
  summary: 'PARTIAL/lean-positive. L0 analytic+MC sim (CPU/stdlib/serial, results/sweep_*.csv).
    A(gap-vs-fetch): inter-turn gap hides host<->GPU KV fetch in 89.7% of 630 cells;
    fails only at 448MiB prefix + 8GB/s + C>=16 + gap<=1s. B(Pareto): agent-gap-timed
    demote+prefetch beats evict-recompute on resume-TTFT in 93.5% of 7560 cells (up
    to 488-3413x lower for large prefixes since recompute scales w/ prefix while hidden
    fetch ~0); LOSES in 6.5%, of which 70% are PCIe-BW-BOUND (C/p_rr*bytes > BW*gap)
    -- the pre-registered make-or-break risk, materialized exactly as modeled. Worst
    loss ~13-50x worse (512blk,8GB/s,C=32,prr=0.5,gap=0.2s). Win-region: prefix<=256blk,
    BW>=16GB/s, C<=8, gap>=1s, p_rr>=0.7 (1 loss/7560 in sane box). Claim NOT universally
    strict-better -> SCOPE it. Mechanism overlaps vLLM-swap(reactive)/LMCache(cross-req)/FlexGen/InfiniGen;
    novelty=gap-timing only, NOT the DMA path. Next: real GPU L1 (measure real concurrent
    PCIe BW, real vLLM/LMCache offload TTFT, real agent gap distribution + re-reference
    prob).'
  data_path: experiments/2026-06-03/EXP-0019/
negative_evidence:
- exp_id: EXP-0021
  summary: 'L1 honest result: tiered KV demote-during-gap + prefetch-on-resume mechanism
    is PRIOR ART (AttentionStore/CachedAttention ATC24, Pensieve, SGLang HiCache,
    vLLM-v1; agent-gap framing subsumed by Continuum). Real measured H100 PCIe BW:
    H2D 57 / D2H 53.5 GB/s solo; bidi agg 80-98 GB/s (-20-25%/dir self-contention);
    concurrent active decode costs only -4.7% (DMA independent of SM/HBM, so L0 fair-share-under-decode
    was pessimistic). With real BW + real prefill (30-40k tok/s, not strawman) + the
    two omitted baselines, REACTIVE fetch-on-demand STRICTLY DOMINATES demote+prefetch
    for all p_rr<1 (1.18-1.43x more effective serving capacity, zero wasted speculative
    H2D) and ties at p_rr=1 (prefetch saves only ~18ms). Kill-corner BROADENED, not
    shrank. Even the kill-corner characterization is pre-empted by Meng et al kappa_crit
    (2601.19910). E5 real gap trace UNAVAILABLE (sensitivity used). Only survivor:
    narrow measurement-only note that binding constraint is bidirectional self-contention
    not compute-vs-copy fair-share. Committee#2 verdict: WEAKEN toward REFUTE; measurement-only
    on what survives.'
  data_path: experiments/2026-06-03/EXP-0021/
