claim_id: CLAIM-0011
project_id: PROJ-0003
stage: seed
status: weakened
claim: 'Agentic failure-recovery exhibits a PREEMPT-vs-ISOLATE harness regime difference
  independent of error TEXT: on a redirectable hard-block, some harnesses fire the
  blocked tool + its sanctioned twin in a PARALLEL batch (Claude Code: lenient any-after-window
  0.93) while others ISOLATE the blocked call (Codex: 0.09), DESPITE both having a
  fully-available in-inventory twin (twin-availability 100% across harnesses). The
  tool-inventory confound is refuted (Codex has+uses a twin yet doesn''t redirect).
  CAVEAT: the STRICT reactive in-thread redirect rate co-varies with whether the error
  message NAMES an alternative (error-naming confound LIVE); and under a uniform strict
  definition CC''s redirect collapses 66/66->2/43. So the surviving claim is preempt-vs-isolate
  as a harness/routing fact, NOT ''error-class/error-text drives reactive redirect''.
  Causal model-vs-harness separation needs GATE-1 interventional.'
why_it_matters: 'The durable, cross-harness-CONFIRMED finding from the PROJ-0003 lineage
  (CLAIM-0008 occurrence refuted, 0009 config-fact, 0010 deflated): the recovery-modality
  signal that looked like error-class prediction is actually the harness routing layer,
  now demonstrated ACROSS 2 independent harnesses (Claude Code + Codex) on identical
  errors. A clean, defensible characterization + a transferable measurement methodology.'
