claim: "Agentic failure-recovery MODALITY is determined by the HARNESS ROUTING CONFIGURATION,\
  \ not by error-class or model reasoning: given an identical error (e.g. 'external\
  \ web access not permitted'), different harnesses produce systematically different\
  \ recovery modalities \u2014 Claude Code redirects in-thread (66/66 blocked WebFetch\
  \ -> sanctioned search) while OpenAI Codex abandons + pre-empts (0/142 in-thread\
  \ redirects). The redirectable-vs-terminal GATE TAXONOMY is harness-agnostic, but\
  \ WHICH modality fires is a per-harness routing-table fact."
