supporting_evidence:
- exp_id: EXP-0031
  summary: 'Gemini CLI 3rd-harness replication of CLAIM-0011. Corpus: 62 sessions
    (18 w/ tool calls), 198 calls, 60 failures. Gate taxonomy CONSISTENT across 3
    harnesses (each has a REDIRECTABLE block w/ named sanctioned alt: CC web_disabled,
    Codex input_filter, Gemini run_shell_command-not-found). Gemini''s REDIRECTABLE
    gate recovers 6/6 (1.000, Wilson[0.610,1.000]) by IN-THREAD cross-tool redirect
    vs 0 same-tool (blocked tool not in inventory) -> matches Claude Code (66/66),
    NOT Codex (0/142 abandon+preempt). Per-gate: REDIRECTABLE redir-share 1.000 [0.610,1.000]
    vs GRANT_REQUIRED 0.267 [0.109,0.520] vs TRANSIENT 0.250 [0.120,0.449] (non-overlapping).
    Promotes confound from 2-harness to robust 3-harness characterization: taxonomy
    harness-agnostic, modality per-harness w/ 2 regimes (in-thread-redirect CC+Gemini;
    abandon+preempt Codex). SUPPORT. Caveat: small n=9 blocks; Gemini anchor is tool-not-in-inventory
    (structural twin), no web tool in corpus.'
  data_path: experiments/2026-05-31/EXP-0031/
negative_evidence:
- exp_id: EXP-0032
  summary: 'GATE-2 confound ablation (CC+Codex+Gemini corpora). INVENTORY-OVERLAP
    confound REFUTED: Codex has fully-available in-inventory web twin (three_pai_external_web_search,
    442 calls, present 41/41 block-sessions) yet 0 reactive in-thread redirects ->
    twin-availability is 100% constant across all 3 harnesses, cannot drive modality.
    ERROR-MESSAGE-NAMING confound PARTIALLY LIVE: strict reactive-redirect rate co-varies
    with whether the block error names an in-inventory alt (Gemini names->0.667; CC
    ''Internet mode not enabled'' + Codex ''try Claude Code'' name no in-inv tool->0.047,0.000).
    Uniform strict redefinition collapses CC''s headline 66/66 to 2/43; CC and Codex
    are more similar than EXP-0031 claimed. CC-vs-Codex gap survives at lenient any-after-window
    (0.93 vs 0.09) but reflects preempt-vs-isolate routing, not clean reactive redirect.
    NET: WEAKEN - one confound discharged, one not; claim must be restated around
    preempt-vs-isolate + strict numbers; GATE-2 only PARTIALLY passed.'
  data_path: experiments/2026-05-31/EXP-0032/
