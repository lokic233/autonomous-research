claim: '[WEAKENED toward refutation, EXP-0033] The cross-harness recovery-MODALITY
  difference originally claimed (CC redirects vs Codex abandons) DOES NOT survive
  clean data: Codex double-logs tool calls; deduped, Codex PREEMPTS 152/152 (same
  modality bucket as CC), so CC-vs-Codex is NOT a routing-regime contrast. The only
  nonzero in-thread reactive redirect (Gemini 2/9) is perfectly confounded with whether
  the error message NAMES an in-inventory alternative (only Gemini''s does) -> the
  residual signal is consistent with PROMPT/error-naming-driven, NOT harness-routing-driven.
  SURVIVING (weak): preemptive parallel twin-firing is common across harnesses (CC
  79%, Codex 100%) but that is NOT error-class- or harness-routing-determined modality.
  The original thesis is largely REFUTED on-node; any residual routing-vs-prompt-vs-model
  separation needs the off-node GATE-1 interventional.'
why_it_matters: 'The durable, cross-harness-CONFIRMED finding from the PROJ-0003 lineage
  (CLAIM-0008 occurrence refuted, 0009 config-fact, 0010 deflated): the recovery-modality
  signal that looked like error-class prediction is actually the harness routing layer,
  now demonstrated ACROSS 2 independent harnesses (Claude Code + Codex) on identical
  errors. A clean, defensible characterization + a transferable measurement methodology.'
