supporting_evidence:
- exp_id: EXP-0031
  summary: 'Gemini CLI 3rd-harness replication of CLAIM-0011. Corpus: 62 sessions (18 w/ tool calls),
    198 calls, 60 failures. Gate taxonomy CONSISTENT across 3 harnesses (each has a REDIRECTABLE block
    w/ named sanctioned alt: CC web_disabled, Codex input_filter, Gemini run_shell_command-not-found).
    Gemini''s REDIRECTABLE gate recovers 6/6 (1.000, Wilson[0.610,1.000]) by IN-THREAD cross-tool redirect
    vs 0 same-tool (blocked tool not in inventory) -> matches Claude Code (66/66), NOT Codex (0/142 abandon+preempt).
    Per-gate: REDIRECTABLE redir-share 1.000 [0.610,1.000] vs GRANT_REQUIRED 0.267 [0.109,0.520] vs TRANSIENT
    0.250 [0.120,0.449] (non-overlapping). Promotes confound from 2-harness to robust 3-harness characterization:
    taxonomy harness-agnostic, modality per-harness w/ 2 regimes (in-thread-redirect CC+Gemini; abandon+preempt
    Codex). SUPPORT. Caveat: small n=9 blocks; Gemini anchor is tool-not-in-inventory (structural twin),
    no web tool in corpus.'
