design_notes:
- 'v2 INTERVENTIONAL DESIGN + on-node disentanglement check (researcher-0009-design,
  2026-05-31): the routing-vs-model-vs-error-naming separation is GENUINELY OFF-NODE-BLOCKED.
  On-node, modality is a PERFECT 3-WAY ALIAS: harness (x) model (Codex=gpt-5.5, CC=Claude,
  Gemini=Gemini, a perfect diagonal) (x) error-naming (only Gemini names an in-inv
  twin). OpenCode (the only model-agnostic harness, 80 sess on-node) logs NEITHER
  model NOR tool/error/outcome -> the same-model-cross-harness cell (C1 vs C2) cannot
  be run on-node. The v2 factorial (OpenCode-pivot, 6 cells C1-C6, identical block,
  error-text held fixed, Wilson CI N>=30/cell, logistic GLM on harness+model+errortext)
  is the off-node experiment that breaks the alias; pre-registered PASS (harness-routing
  wins) = |R(C1)-R(C2)|>0.5 AND R(C2)~R(C3); KILL = model-disposition or error-text
  dominates. On-node proxy (within-Claude-Code cross-VARIANT, family-blind): opus
  variants that hit the gate redirect >=0.93 (modality stable across same-family variants)
  -> weakly toward harness-routing but cannot touch the OpenAI-vs-Claude disposition
  axis (2603.02277). Design at prior_art/PROJ-0003/CLAIM-0009_interventional_design_v2.md.'
disposition: "DONE-as-refuted (researcher-0011-final, 2026-05-31). The cross-harness\
  \ routing-determines-modality thesis DISSOLVES under clean data: Codex double-log\
  \ artifact corrected (deduped Codex PREEMPTS 152/152, same dominant mode as CC +\
  \ Gemini -> headline contrast gone); the only significant cross-harness difference\
  \ (CC reactive 5/43 vs Codex 0/152, Fisher p=0.0004) is DIRECTION-WRONG vs the restated\
  \ preempt-vs-isolate claim, a 5-event tail over a shared preempt mode, and perfectly\
  \ ALIASED with model disposition (Claude vs GPT, cf arXiv:2603.02277); naming confound\
  \ collinear w/ harness (within-Gemini test non-sig p=0.64). SURVIVING (narrow, NOT\
  \ modality-routing): the REDIRECTABLE gate TAXONOMY (each harness has a structurally-identical\
  \ hard-block-with-named-alternative; gate-type carries recovery info WITHIN a harness)\
  \ \u2014 but that is the pre-existing EXP-0008/MAP-0002 insight, generic form pre-empted\
  \ by LangGraph, not a standalone novel claim. DURABLE CONTRIBUTION = the METHODOLOGY\
  \ (double-log dedup, naming-confound control, uniform strict def collapsing CC 66/66->5/43,\
  \ discharged tool-inventory confound). Fold into PROJ-0003 negative-result synthesis.\
  \ NOT cemetery (methodology + taxonomy + fully-specified revival experiment salvageable)."
