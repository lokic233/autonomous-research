claim: 'Agentic failure-recovery MODALITY is determined by the HARNESS ROUTING CONFIGURATION, not by error-class
  or model reasoning: given an identical error (e.g. ''external web access not permitted''), different
  harnesses produce systematically different recovery modalities — Claude Code redirects in-thread (66/66
  blocked WebFetch -> sanctioned search) while OpenAI Codex abandons + pre-empts (0/142 in-thread redirects).
  The redirectable-vs-terminal GATE TAXONOMY is harness-agnostic, but WHICH modality fires is a per-harness
  routing-table fact.'
why_it_matters: 'The durable, cross-harness-CONFIRMED finding from the PROJ-0003 lineage (CLAIM-0008 occurrence
  refuted, 0009 config-fact, 0010 deflated): the recovery-modality signal that looked like error-class
  prediction is actually the harness routing layer, now demonstrated ACROSS 2 independent harnesses (Claude
  Code + Codex) on identical errors. A clean, defensible characterization + a transferable measurement
  methodology.'
