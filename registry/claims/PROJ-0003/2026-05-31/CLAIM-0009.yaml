claim: "Agent recovery MODALITY (same-tool-retry vs cross-tool-redirect) is characterized\
  \ by GATE-TYPE + harness routing (REDIRECTABLE hard-block -> cross-tool redirect;\
  \ GRANT-REQUIRED permission -> same-tool; TRANSIENT -> same-tool-dominant), a CONFIG/ROUTING\
  \ fact of the harness \u2014 NOT a prediction from error-class. EXP-0012: error-class\
  \ adds <=0.2% over a single REDIRECTABLE bit (lift over gate-type-only = -0.0043\
  \ out-of-sample); error-class & gate-type are observationally INSEPARABLE on this\
  \ single-harness corpus."
why_it_matters: 'EXP-0008 refuted CLAIM-0008 (occurrence) but surfaced a sharper,
  defensible signal: error-class predicts the MODALITY of recovery. This re-seeds
  the surviving kernel as its own falsifiable claim.'
novelty_hypothesis: ''
