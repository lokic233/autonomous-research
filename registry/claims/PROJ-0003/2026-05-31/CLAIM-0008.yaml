  effect: weaken
  summary: "OUTCOME-DEFINITION DECOUPLING (CPU, same corpus 71 sessions/357 failures,\
    \ recovery def broadened to count CROSS-TOOL workarounds within K=6, intent-class\
    \ matched = UPPER bound vs EXP-0007 same-intent LOWER bound). FINDING: error-class\
    \ signal WASHES OUT. Cramer V 0.644->0.239 (perm-p=0.164, NOT significant); out-of-sample\
    \ LOO-Brier improvement +0.087 -> -0.0006 (~0%, no gain over class-agnostic null).\
    \ Permanence axis (crux) COLLAPSES: permanent-vs-transient phi 0.454->0.138; permanent\
    \ bucket recovery 0.250->0.580, transient barely moves 0.707->0.713. ROOT CAUSE:\
    \ EXP-0007 headline was driven by policy.web_disabled scored 0/109 \u2014 but\
    \ that is a REDIRECTABLE gate (blocked WebFetch -> sanctioned external_web_search,\
    \ 66/109=0.606, all audited as genuine same-goal recoveries), NOT terminal. K-sensitivity\
    \ confirms not a windowing artifact (signal weakens further as K grows). DEFENSIBLE\
    \ narrower reformulation: error-class predicts recovery MODALITY (same-tool retry\
    \ vs cross-tool redirect), NOT recovery OCCURRENCE \u2014 but that is a DIFFERENT\
    \ claim than CLAIM-0008. Limits: single-harness; decisive cell n=109."
  data_path: experiments/2026-05-31/EXP-0008/
