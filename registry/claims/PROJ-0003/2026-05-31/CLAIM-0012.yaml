claim: "In real multi-harness agent traces, tool-call failures are temporally OVER-DISPERSED\
  \ within a session relative to a within-session Bernoulli null (failures cluster\
  \ / are bursty); replicates across Claude Code (Stouffer Z=-4.07) and Codex (deduped\
  \ Z=-15.07), and is NOT a web_disabled artifact (reclassifying web_disabled as non-failure\
  \ STRENGTHENS the signal). Purely DESCRIPTIVE arrival-process statistic \u2014 no\
  \ prediction, no error-class conditioning."
why_it_matters: "Orthogonal to the refuted PROJ-0003 error-class->recovery lineage\
  \ (different estimand: arrival structure vs conditional recovery). A cross-harness\
  \ descriptive benchmark statistic (agent failure burstiness coefficient) that no\
  \ prior work reports \u2014 MAST/AgentBench/tau-bench measure static failure taxonomies;\
  \ Mirage/Canonical-Path-Deviation study failure POSITION in curated benchmarks.\
  \ NeurIPS D&B genre, alongside the negative-result+methodology synthesis."
