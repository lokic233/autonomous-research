  effect: support
  summary: 'L1 PROBE (CPU, --claim none, deduped): per-session Wald-Wolfowitz runs
    test on the failure-indicator sequence, sessions combined via Stouffer (Z<0=clustered).
    CC: 17 sess/1661 results/6.9% fail/Stouffer Z=-4.07 (p~2e-5), 71% sess Z<0. Codex
    (deduped by call_id, neutralizes EXP-0033 double-log): 43 sess/1871/5.3%/Z=-15.07,
    77% sess Z<0. M4 DECISIVE: reclassifying web_disabled as non-failure on CC STRENGTHENS
    (-4.07->-4.63) -> burstiness driven by ordinary perm/fs/exec failures, NOT the
    refuted redirectable cell. Replicates 2/2 harnesses. Collision-CLEAR (zero burst/temporal/overdispersion
    hits in registry; closest neighbors Mirage 2604.11978 / Canonical-Path 2602.19008
    study failure POSITION in curated benchmarks, distinct from real-trace arrival
    over-dispersion). CAVEATS: thin CC n=17 (per-session median Z only -0.41, CC leg
    carried by Stouffer aggregation; Codex is the strong leg); window-5 dispersion
    index ~1.0 (runs test sees order-clustering the coarse window misses); heuristic
    failure labels; Gemini 3rd harness NOT yet run; mechanism unclaimed (keep PURELY
    descriptive).'
  data_path: experiments/2026-05-31/EXP-0037/
- exp_id: EXP-0038
  summary: 'L2 SUPPORT. 3-harness replication met (D&B bar): CC Stouffer perm Z=-4.07,
    Codex=-15.14, Gemini=-3.90 (NEW 3rd harness; 80-90% sessions Z<0). Per-session
    PERMUTATION null (N=2000 shuffles) near-identical to analytic WW Z in all 3 ->
    small-n/heuristic-label robust; thin CC leg survives intact. Burstiness B[boot
    95% CI] (corrected, Kim&Jo): CC 0.417[0.001,0.453], Codex 0.270[0.072,0.395],
    Gemini 0.213[-0.419,0.319]; dispersion idx 1.41-1.94 all>1 bursty. HONEST: B-CI
    strictly>0 only Codex; CC barely; Gemini crosses 0 (42 gaps); per-session raw
    B negative = Goh-Barabasi finite-size bias, not anti-burst -> lead with runs/permutation+dispersion,
    report B w/ finite-size caveat. M4 web_disabled ablation HOLDS under permutation+all
    3 harnesses (CC STRENGTHENS -4.07->-4.93; Gemini no web tool=no-op). Core descriptive
    over-dispersion claim solid; single-scalar B only CI-clean on strong Codex leg.
    Stayed purely descriptive.'
