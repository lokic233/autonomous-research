claim: 'In zenoh 1.9.0 (Eclipse zenoh, the DEFAULT ROS 2 RMW transport rmw_zenoh;
  genuinely young, 1.0 only late 2024), a Publisher::put() returns Ok(()) for 100%
  of messages while 68-77% are SILENTLY DROPPED to a slow subscriber over a transport
  link -- AND setting CongestionControl::Block (the documented "wait, do not drop"
  knob) does NOT prevent the loss, because zenohs congestion control is PER-HOP, not
  end-to-end, a fact its docs never warn about (drops not even logged at RUST_LOG=zenoh=debug).
  The NOVEL mechanism (verified in installed source zenoh-protocol core/mod.rs): a
  SPLIT default -- CongestionControl::DEFAULT_PUSH=Drop (data-plane put) but DEFAULT_REQUEST/DECLARE/INTEREST/OAM=Block
  (control-plane) -- so a developer who validated reliability with get() (Block, never
  drops) then switches to put() (Drop) silently flips contract; and even put() with
  Block loses because the downstream forwarding node applies its OWN per-hop Drop,
  the publishers Block does not propagate. NULL EXIT: fast consumer (slow_us=0) ->
  0.00% loss (rules out tautology). VERIFIED on devlvm14382 (zenoh 1.9.0 built+probed,
  2 sessions over tcp/127.0.0.1, N=50000 8-byte): default Drop -> put_ok=50000 put_err=0
  received~15600 = ~68.8% LOST (reproduced 68.8/68.8/76.5); loss monotone in consumer
  slowness (0us->0%, 50us->43%, 200us->69-77%); CongestionControl::Block -> STILL
  68.5% loss (Block did not block) = per-hop-not-end-to-end; offload-to-unbounded-channel
  control -> STILL 68.7% loss = drop is in transport/forwarding path not the app callback.'
why_it_matters: "FRESH-DOMAIN (distributed-systems / OS-runtimes), IMMATURE-WEDGE\
  \ seam, scout-CC GO 8.5/10 (highest-rated immature-wedge candidate; the cleanest\
  \ fresh-domain shot). CLAIM-0059/wazero winning shape: a DEFAULT in the young tool\
  \ silently SETS a surprising CORRECTNESS property (acknowledged-but-dropped delivery\
  \ + a documented anti-drop knob that does not work) neither endpoint predicts +\
  \ docs do not warn + fully silent (no error, no debug log). \u2605\u2605 CLEARS\
  \ THE fjall MATURE-LINEAGE CAP (the new screen): the mechanism is GENUINELY NEW\
  \ to zenoh, NOT inherited -- superficially resembles MQTT-QoS/DDS-RELIABILITY/TCP-flow-control\
  \ but those are END-TO-END (acked/windowed); zenoh INVERTED this with a novel SPLIT\
  \ default (data=Drop/control=Block) + a PER-HOP congestion fabric (doc literally\
  \ defines it per-node), its OWN data-centric routing invention, verified in source.\
  \ The seam lives in zenohs NOVEL part, not a reimplemented-classic. \u2605 CLEARS\
  \ THE POSIX BARRIER: non-crash semantic/abstraction-leak seam (wazero-shaped), POSIX-barrier\
  \ N/A. 6-GATE: #1 incremental-composition (neither the Ok-returning put API nor\
  \ the Block knob predicts silent end-to-end loss; docs do not warn). #2 verify (installed+built+measured\
  \ zenoh 1.9.0, not assumed). #3 issue-tracker/CVE/paper + mature-lineage: UN-OWNED\
  \ (no CVE/paper; #1494 is a DIFFERENT narrow big-message-fragment-drop bug; the\
  \ put-Ok-while-dropped + Block-not-end-to-end COMPOSITION is not in tracker; mechanism\
  \ is zenohs novel per-hop split-default not inherited). #4 not-folklore (no doc\
  \ warning, no debug log, not in tracker). #5 structural-prevalence (default put\
  \ + a consumer that can not keep up = extremely common; it IS the ROS 2 default\
  \ transport, slow consumers are the norm). #6 not-tautology (fast-consumer control\
  \ -> 0.00% loss, the null can+does fire). LIVE RISK: a reviewer may say \"best-effort\
  \ PUSH drops, standard pub/sub\" -> ANCHOR the claim on the un-owned surprising\
  \ parts: (a) the SPLIT default silently flipping contract between get (Block) and\
  \ put (Drop), (b) CongestionControl::Block MEASURABLY failing end-to-end with NO\
  \ doc warning -- NOT \"best-effort drops\". Mitigations: small 8-byte payloads (avoid\
  \ the #1494 fragmentation confusion); for the GREEN measurement add an explicit\
  \ 3-node pub->zenohd-router->slow-sub topology to make per-hop!=end-to-end unambiguous.\
  \ scout-CC self-rating 8.5/10."
