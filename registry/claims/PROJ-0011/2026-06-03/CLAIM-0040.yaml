supporting_evidence:
- exp_id: EXP-0037
  summary: 'L0 analytic+MC sim (7 seeds, 1260 cells, serial, stdlib): early-commit
    on streaming tool-result PREFIX for agent re-ingestion. HELD-PARTIAL. 1064/1260
    cells robust-win; realistic region (acc 0.7-0.8, f_fl 0.3-0.5) +12.1%, high-rho
    up to +48%. KEY: break-even p*=W/((1-d)rho+W) is LOW (0.07-0.39) exactly where
    payoff is HIGH (rho>=2) -- the INVERSE of EXP-0004''s spec-tool-CALL-prefetch
    trap; a mediocre detector (acc~0.75) clears p* in every rho>=2 cell (W<=2). The
    two model-internal negative triggers (wrong-commit dominance, implausible-accuracy
    break-even) did NOT fire. HELD because two falsifiable parts are EMPIRICAL and
    unmeasurable CPU-only: (A) real front-loading rate, (B) real partial-stream detectability
    -- BLIND detector ablation (242/540 win, loses to -57% on tail-heavy) proves detectability
    is load-bearing. L1 must measure real tool-result corpora (API/RAG/code-exec/log),
    real rho=T_stream/T_step, real redo cost W (side-effects=>W>1, gate to reversible
    steps). Novelty vs prior art = the correctness-safety break-even map for SEMANTIC
    early-commit, not the overlap (streaming-LLM) itself. Paths: experiments/2026-06-03/EXP-0037/{PRE_REGISTRATION.md,RESULTS.md,sim_early_commit.py,results/*.csv}.'
  data_path: experiments/2026-06-03/EXP-0037/
negative_evidence:
- exp_id: EXP-0038
  summary: 'GATE KILL (researcher wrote RESULTS.md but stalled pre-exp-complete; orchestrator
    finalized). Cheap corpus-only gate (N=1641 real tool-result records, 5 classes)
    on CLAIM-0040: rho<1 for ALL real classes (results short 46-225 tok, prefill ~instant
    vs next decode step; 0-9% clear rho>=1; lone high-rho search_rag collapses to
    0% under realistic next-step) -> nothing to overlap. Dumb-truncation@N512 fully
    captures actionable content for 4/5 classes (100%) -> apparatus unjustified. Adversarial
    (f_fl,rho) bind confirmed: only high-rho class is the only NON-end-front-loaded
    + truncation-resistant one. Prior-art cleared (LLMCompiler/CALM/spec-decode distinct;
    niche open but empirically empty). EXP-0037''s favorable break-even was real math
    over an operating point that does not exist in real tool traffic. GATE SAVED A
    WASTED GPU L1.'
  data_path: experiments/2026-06-03/EXP-0038/
- exp_id: EXP-0038
  summary: 'GATE FAILED -> KILL. Measured real tool-result distributions (N=1641,
    HotpotQA+TriviaQA+AgentInstruct os/db/kg/webshop, real gpt2 tokenizer). (1) f_fl:
    clears >=0.3 front-loading for SHORT classes (api/code/db/web 68-98% start<=0.3)
    BUT the only long class search_rag has actionable-END front-loaded only 5.5%.
    (2) rho=T_stream/T_step FAILS HARD: median rho 0.007-0.508 (midband), 0-9% clear
    rho>=1; only search_rag clears, and ONLY due to (a) artificial 1274-tok HotpotQA
    distractor + (b) optimistic 11-tok next-step. Under a realistic reasoning next-step
    (>=64 tok) search_rag collapses to 0% rho>=1. Real tool results stream fast vs
    reasoning -> nothing to overlap. (3) JOINT adversarial bind CONFIRMED: the only
    high-rho class (search_rag) is also the only NOT-end-front-loaded and only truncation-resistant
    one; premises anti-correlated in the paying regime. (4) DUMB-TRUNCATION N<=512
    fully captures actionable content for 4/5 classes (100%) -> detector/redo apparatus
    UNJUSTIFIED. Plus incremental-prefill is the real prod baseline (results enter
    KV continuously; no wait-for-EOF stall). (5) Prior-art: LLMCompiler(call-DAG parallel,
    lossless), CALM(early-exit on model''s OWN confidence), Leviathan spec-decode(lossless)
    -> NONE do correctness-safe semantic commit on a partial/streaming tool RESULT;
    niche open but empirically empty. EXP-0037''s favorable p* was correct math over
    an operating point (rho>=2, long slow front-loaded results) that does NOT occur
    in real agent traffic. Kill rule fired on TWO independent criteria (rho<1 + dumb-trunc-matches).
    Saved a wasted GPU L1.'
  data_path: experiments/2026-06-03/EXP-0038/
