    default W=8 does NOT heal (46% @C16) so NOT a weaken. Stateless arm rises 0%(C1)->97%(C32)
    (small chunks fragment worst). Phrase-len moderator confirmed: 1-tok=100% (null
    control), 2/3/4-tok=88/77/65%. NULL exit did not fire. Cross-seam coupling real:
    runtime must set W>=chunk+max-phrase-len, a param neither org owns alone.'
