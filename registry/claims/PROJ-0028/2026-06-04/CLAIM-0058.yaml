  \ single-area train-eff+eval-safety exhausted). Couples INFERENCE-RUNTIME (owns\
  \ the flush/chunk knob, tuned for ITL/SSE, no model of the safety window) x EVAL-SAFETY\
  \ (owns the streaming moderator, benchmarked on WHOLE completions, no model of the\
  \ flush schedule); the shared UNMODELED object = the flush boundary fragmenting\
  \ multi-token violation spans. EMPIRICAL, NO closed form. Passes all 10 killers\
  \ + 3 lessons + runtime-mitigation: #10 GENUINE NULL EXIT (unbounded-rescan moderator\
  \ -> flat 100% -> FALSE; effect requires the common latency-motivated bounded/stateless\
  \ config; parameter-dependent on chunk-size x phrase-length, not construction-forced;\
  \ the null is itself a publishable 'seam-safe-by-current-practice' negative); #9\
  \ NOT-textbook (phrase-fragmentation-across-emit-boundaries is not a named result;\
  \ Orca OSDI22 + vLLM + Llama-Guard/OpenAI-Moderation/2512.03553/2604.14865 are SILENT\
  \ on the seam); LESSON-A SYNTHESIS DEFENSE = the cross-seam BENIGN interaction via\
  \ the runtime's flush schedule is the non-obvious novelty (streaming + finite-window\
