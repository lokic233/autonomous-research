negative_evidence:
- exp_id: EXP-0002
  summary: 'CPU token-proxy cost-surface (100 cells x3 reps). Reproduced ~2% anchor
    (CTX=4000,inj=40: 2.0-2.4%). Full surface: min0.02/median1.34/max53.05% recompute.
    LAW: recompute% tracks injection_tokens/seq_len (slope~1), NOT edit position (position
    spread median 0.39pp, max 5.07pp). 2% bar holds ONLY where inj/seq<=~1% (66/100
    cells); BREAKS to 5.3%@200tok/4k, 20%@1000tok/4k, 49-53%@1000tok/1k. So ~2% is
    a conditional cost-map contour, not a universal CDC property; edit position (prepend/terminal/depth)
    is not the cost driver, injection size relative to context is. Weakens unconditional
    2% framing; supports CLAIM-0006 reframe to conditional regime (inj/seq).'
  data_path: experiments/EXP-0002/
- exp_id: EXP-0005
  summary: 'WORKLOAD REALISM (CPU token-proxy, 20k tasks/291k injections, cited sizes):
    over a realistic agentic tool-use mix the MEDIAN inj/seq=2.8% (ABOVE the 1% CDC-wins-big
    threshold); only ~25% of injections fall in inj/seq<=1% (recompute<~2.4%), ~37%
    in the >5% degrade regime, and ~81% of injected TOKENS are in the degrade regime
    (large file/code/RAG/JSON dumps dominate volume). Confirms the committee crux:
    the ~2% headline is a best-case contour, NOT the common case. CONDITIONAL caveat
    (fair-to-CDC): given large reused context S>=50k (the regime SWE-ContextBench
    shows dominates real long-horizon work, >97% cache-read) CDC wins on 46% and degrades
    on only 10%. Net: WEAKEN the unconditional framing; conditional claim survives
    only gated on (large reused ctx AND bounded injection). Proxy, not wall-clock;
    modeled distribution not live-trace; robust across 3 sensitivities.'
  data_path: experiments/2026-05-31/EXP-0005/
