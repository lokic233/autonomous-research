claim_id: CLAIM-0006
project_id: PROJ-0002
stage: candidate
status: weakened
claim: 'Prefix-Cache Invalidation Law (characterization): a mid-prompt tool injection of size R into a
  reused prefix of length S forces recompute fraction that tracks inj/seq = R/S (slope ~1), independent
  of edit position. Chained-decode-cache (CDC) repair attains <=~2.38% recompute and beats vLLM-APC /
  SGLang-RadixAttention / FlashInfer by 8x-465x (token-recompute), but ONLY in its win-region inj/seq<=~1%;
  over a realistic agentic mix the median inj/seq~2.8% so the ~2% headline is a best-case contour, not
  the common case (CDC wins ~25% of injections overall, ~46% when conditioned on large reused context
  S>=50k).'
why_it_matters: 'Maps + bounds the win-region of CDC-style prefix-cache repair under agentic tool injection:
  the contribution is the COST-MAP / invalidation LAW + honest head-to-head positioning, not the CDC mechanism
  (known: Irminsul, the PIC family, CDC storage-dedup).'
novelty_hypothesis: 'MECHANISM (CDC content-defined repair over a radix/prefix cache) is NOT novel: collides
  with Irminsul arXiv:2605.05696 (single-source flag) + the PIC family EPIC arXiv:2410.15332 / MEPIC arXiv:2512.16822
  / CacheBlend arXiv:2405.16444 / Cache-Craft arXiv:2502.15734 (multi-source), and rests on decades-old
  CDC storage-dedup (FastCDC/Rabin). NOVEL = the Prefix-Cache Invalidation LAW: conditional recompute
  cost-map (recompute% ~ inj/seq, slope~1; win iff inj/seq<=~1%), its measured win-region over a realistic
  agentic workload distribution, and the head-to-head recompute-fraction positioning vs vLLM-APC/SGLang-Radix/FlashInfer.
  No prior work found drawing this contour.'
mandatory_baselines:
- vLLM APC
- SGLang RadixAttention
- FlashInfer
academic_map_nodes:
- MAP-0001
supporting_evidence:
- exp_id: EXP-0003
  summary: 'CPU recompute-fraction microbench, mid-prefix insertion. CDC <=2.38% (position-independent)
    vs vLLM APC / RadixAttention / FlashInfer all ~(1-f) = 10.1-90.1% (position-dependent). KEY: SGLang
    RadixAttention token-granularity does NOT make this cheap (10.1-90.1%, ~= vLLM in token terms) ->
    CLAIM-0006 does NOT collapse into DEAD-0006 (radix min 10.1% >> CDC max 2.38%). FlashInfer has no
    cache policy (==host engine). CDC advantage over binding baseline (Radix) = 8.3x (late inject f=.9,4k)
    to 465x (early inject f=.1,32k), grows with ctx. Scope: count model not wall-clock (NT2_WALLCLOCK
    H100 already confirmed translation). All 3 mandatory baselines now positioned head-to-head.'
  data_path: experiments/2026-05-31/EXP-0003/
