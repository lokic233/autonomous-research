supporting_evidence:
- exp_id: EXP-0044
  summary: 'INVERTED-U HELD. When query-term-bearing topical boilerplate is on the
    DISTRACTORS and the canonical answer doc stays CLEAN, the clean answer''s BM25
    rank traces a clear inverted-U in template length L: worsens to an interior maximum
    then RECOVERS to #1. HELD in 3/4 (frac,T_qterms) cells by the pre-registered CI
    test (interior CI excludes both endpoint means); 20/20 seeds within-seed inverted-U
    in the strongest cell (frac=1.0,T=2: rank 1.10->peak 5.20@L16->1.00@L512), 18/20
    (0.5,2), 13/20 (1.0,1); weakest cell (0.5,1) non-monotone-NS only. MECHANISM CROSSOVER
    EXPLICIT: top-distractor score jumps 25.8->32.9@L16 (query-term injection overtakes
    flat ~29 answer score => rank worsens), then dist length-norm (1.0->7.6) crushes
    bloated distractors back to 22.8 (=> recovery). This is the crossover DEAD-0011
    lacked (there boilerplate was non-query on the ANSWER => monotone). Honest nuance:
    qterm_idf flat across L>0 (df fixed once present), so the L-driven recovery is
    length-norm-dominated while IDF-collapse modulates depth via the SPREAD axis.
    Distinct, complementary to DEAD-0011. stdlib BM25 k1=1.2 b=0.75 verified <1e-9.'
  data_path: experiments/2026-06-03/EXP-0044/
- exp_id: EXP-0047
  summary: 'HELD-STRONG. b-sweep: b=0 abolishes recovery (monotone 1.10->14.30, 0/20),
    recovery sharpens monotonically with b -> length-norm is the NECESSARY cause of
    the recovery arm (mechanism confirmed). BM25L (Lv&Zhai delta=0.5, hand-verified):
    inverted-U PERSISTS (3/4 cells HELD, strongest 20/20) -> robust to the known length-penalty
    fix, NOT a default-b artifact. Score-margin substantial (+4.4 -> -4.2 peak ->
    +7.1). Claim rewritten: recovery is length-norm-dominated along L; IDF-collapse
    acts only via SPREAD axis (qterm_idf flat ~4.05 across L). Citations fixed (drop
    2504.21015/2604.05087; add Singhal-Buckley-Mitra 1996, Robertson-Walker 1994,
    Lv-Zhai 2011, Zhong 2023, Doc2Query-- 2023). Recommend fast-track L1: dense-retriever
    test (predict recovery arm dampened/absent without b>0 length penalty).'
  data_path: experiments/2026-06-03/EXP-0047/
- exp_id: EXP-0048
  summary: 'NEGATIVE/REFINING (GPU L1 H100 dense bge+e5). BM25 inverted-U does NOT
    transfer to dense retrieval under realistic query-bearing templates: clean answer
    rank 1.00 at all L both models (FLAT). Only adversarial verbatim-query injection
    displaces it, model-dependently (bge monotone-worse confirms L0; e5 partial inverted-U
    via 512-tok truncation, different mechanism). BOTTOM LINE: CLAIM-0045 is a BM25-specific
    lexical artifact, does NOT threaten dense RAG under normal hygiene. Not a clean
    transfer. Artifacts devgpu014 ~/ros-EXP-0048/.'
  data_path: experiments/2026-06-03/EXP-0048/
