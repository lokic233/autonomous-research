claim: 'Under BM25 with length normalization (b>0), when DISTRACTOR documents carry
  a shared topical template containing some of the query''s terms while the genuine
  canonical answer doc stays CLEAN, the clean answer''s rank degrades NON-MONOTONICALLY
  (inverted-U) as template length L grows: an intermediate L maximally displaces the
  answer, after which further growth RECOVERS its rank toward #1. The recovery along
  the L axis is LENGTH-NORMALIZATION-DOMINATED (at small L the template injects query
  terms into distractors raising their scores above the clean answer; at large L BM25
  length normalization progressively crushes the bloated distractors'' scores back
  below the clean answer; recovery REQUIRES b>0 and is abolished at b=0 where rank
  worsens monotonically). The IDF/spread effect acts ONLY via the SPREAD (frac) axis
  (widening the fraction of templated distractors lowers the curve baseline, qterm_idf
  4.65->4.05) and NOT via L (qterm_idf is FLAT ~4.05 across all L>0 because a distractor''s
  df for a query term is fixed once present, regardless of repetition). The phenomenon
  PERSISTS under the BM25L long-doc over-penalization fix, so it is a property of
  length-normalized lexical retrieval, NOT a default-b over-penalization artifact.
  Corpus-statistics-dependent crossover; no closed-form predictor.'
why_it_matters: 'DISTINCT successor to killed CLAIM-0044/DEAD-0011 in the revival-condition
  regime (query-term-bearing template on DISTRACTORS, not answer; length now moves
  query-term IDF). Pilot inverted-U confirmed 1.17->4.83->1.00. EMERGENT, no closed
  form. Screened vs 3 anti-patterns. Anti-circular: GT=clean-answer doc-id; signal=BM25
  rank from token stats. Honest-negative: monotone/flat both FALSIFY = clean facts.
  Realistic: SEO/template-spam crowding out the canonical clean answer. Prior-art:
  2503.05037 STATIC biases; 2604.05087/2504.21015 add DISTINCT text to TARGET (here
  template on COMPETITORS, query-term-bearing, non-monotone signature); 2605.03824/2110.06918
  query semantics orthogonal. Topic: data-systems-for-ml corpus-hygiene x retrieval.'
novelty_hypothesis: "First report of a clean-canonical-answer rank inverted-U induced\
  \ by query-term-bearing shared template on COMPETITOR docs under length-normalized\
  \ lexical retrieval; recovery is length-norm-dominated (b>0 necessary, robust to\
  \ BM25L). Distinct from: Singhal-Buckley-Mitra SIGIR1996 (pivoted length norm \u2014\
  \ the recovery mechanism, b=pivot slope); Robertson-Walker SIGIR1994 (BM25 length\
  \ norm); Lv-Zhai CIKM2011 (BM25L \u2014 robustness baseline, phenomenon survives\
  \ it); Zhong EMNLP2023 corpus-poisoning (crafted adversarial passages vs our BENIGN\
  \ templates displacing a clean answer non-monotonically); Gospodinov2023 Doc2Query--\
  \ (over-expansion hurts the TARGET doc; ours is on competitors); 2503.05037 STATIC\
  \ biases (not a non-monotone preprocessing response). DROPPED mis-cites: 2504.21015\
  \ (synthetic-data, not doc-expansion), 2604.05087 (unverifiable)."
mandatory_baselines:
- "BM25 b-sweep b in {0,0.25,0.5,0.75,1.0} (b=0 abolishes recovery \u2014 DONE EXP-0047)"
