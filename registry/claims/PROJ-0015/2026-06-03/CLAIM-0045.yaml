revival_conditions: 'REVIVED from DEAD-0011 with new evidence: NEW REGIME + NEW PILOT
  EVIDENCE distinguishing from DEAD-0011: DEAD-0011 placed NON-query low-IDF boilerplate
  on the ANSWER doc and found MONOTONE worsening because (a) bp_idf was FLAT in L
  and (b) boilerplate terms were non-query so never entered the score. This claim
  changes BOTH load-bearing factors: the template is on the DISTRACTORS (answer stays
  clean) AND the template CONTAINS QUERY TERMS, so length L now moves query-term df
  (the IDF axis DEAD-0011''s revival condition explicitly named). 12-seed pilot CONFIRMS
  the inverted-U DEAD-0011 lacked: mean rank 1.17 (L=0) -> peak 4.83 (L=16) -> recovers
  to 1.00 (L=512). The crossover IS present here (length-norm crushes bloated distractors
  + query-term IDF collapse) whereas it was structurally absent in DEAD-0011. This
  is the revival-condition regime, with evidence.'
