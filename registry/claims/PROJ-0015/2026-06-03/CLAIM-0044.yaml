- exp_id: EXP-0043
  summary: 'INVERTED-U FALSIFIED. rank(answer|L) degrades MONOTONICALLY in shared-boilerplate
    length L (non-decreasing in 20/20 seeds across all 3 spread fracs 0/0.25/1.0);
    no interior peak passes the pre-registered CI test (interior CI excludes both
    endpoint means) for any frac. Mechanism decomposition: the posited IDF-decay/length-norm
    crossover CANNOT occur because bp_idf(L) is FLAT in L (a longer IDENTICAL boilerplate
    block does not change df of boilerplate terms; IDF-decay is driven by SPREAD across
    docs, NOT by length) AND boilerplate terms are non-query terms so never enter
    the answer''s query-term score; length-norm grows monotone (1.0->16.2) suppressing
    genuine content tf with nothing pushing back. frac=1.0 gives a gentler monotone
    curve (distractors collapse in lockstep) but still no inverted-U. Clean corpus-hygiene
    negative = WIN. N=2000, stdlib BM25 k1=1.2 b=0.75 verified <1e-9 vs hand calc.'
