claim: "In the standard connected-components near-dedup pipeline (MinHash-LSH candidate\
  \ pairs -> similarity graph -> connected components -> keep one doc per component),\
  \ TRANSITIVE CHAINING causes the pipeline to remove training documents that are\
  \ NOT near-duplicates of any RETAINED document \u2014 a doc D is deleted even though\
  \ its Jaccard similarity to the component's kept representative (and to every retained\
  \ doc) is far below the dedup threshold T, because D is connected to the representative\
  \ only through a chain of pairwise-above-T links. The fraction of removed docs that\
  \ are innocently chained (sim-to-representative < T) is LARGE and grows with corpus\
  \ density, is NOT an artifact of LSH false positives (persists with exact Jaccard\
  \ edges), and the standard non-transitive mitigation (SemDeDup-style: delete a doc\
  \ only if it is DIRECTLY above T to a retained doc) ELIMINATES the effect \u2014\
  \ proving the mechanism is the transitive-closure step, not similarity itself."
why_it_matters: "FRESH AREA (data-systems-for-ml: dedup graph-construction). BEST-DESIGNED\
  \ survivor \u2014 STRUCTURAL CORE L0-SETTLED (transitive-closure deleting sub-threshold\
  \ docs + non-transitive mitigation fixing it is graph-theoretic, harness-controlled,\
  \ can't evaporate); only real-world MAGNITUDE -> L1. Passes ALL 8 killers: NOT metric-validity\
  \ (causal data-removal: WHICH docs deleted); NOT closed-form (innocent-removal fraction\
  \ depends on graph topology/chain-length/density, NOT the LSH S-curve; union-find\
  \ must run; could be ~0 if real graphs clique-like = falsifiable); foundational\
  \ incumbent VERIFIED (Lee2021 NearDup 2107.06499 seminal LLM-dedup = graph+connected-components+keep-one,\
  \ its 200K-doc C4 component IS chaining evidence presented as desirable; MMDS S-curve\
  \ is PAIRWISE-FN not graph-topology); NOT known-mechanism-costume + STRONGEST-BASELINE\
  \ (single-linkage chaining textbook but its consequence for which TRAINING docs\
  \ survive is new; L0 tests vs the STRONGEST standard mitigation SemDeDup-non-transitive\
  \ 2303.09540 NOT a strawman, effect must VANISH there = honest-negative); NOT wrong-currency\
  \ (fraction of unique-content docs wrongly deleted); NOT trivially-small/assumed-shape\
  \ (structurally anchored; real burstiness STRENGTHENS chaining); NOT omitted-mitigation\
  \ (the non-transitive mitigation IS the comparison arm); citations VERIFIED (Lee2021/SemDeDup/BigCode),\
  \ NO IID. DISTINCT from OCCUPIED dedup-representative-selection (which-doc-in-a-true-cluster\
  \ vs the-cluster-is-spuriously-inflated-by-chaining). Falsifiable: synth corpus\
  \ N~5-20k docs as shingle sets; harness builds GT geometry \u2014 CHAINS (each doc\
  \ shares >=T*|shingles| w/ chain-neighbor but drifts so endpoints share <T-delta)\
  \ + tight cliques + singletons; vary chain-length/drift/density. GT = is D a true\
  \ near-dup (Jaccard>T) of the retained representative (harness-known). Pipeline\
  \ reads ONLY shingle sets: exact-Jaccard (or MinHash) edges>T -> union-find connected\
  \ components -> keep lowest-id rep -> mark others removed. MEASURE (L0-settled):\
  \ among removed docs, fraction w/ true Jaccard to retained rep (and all retained)\
  \ < T = innocently-chained. MITIGATION ARM: re-run non-transitive (delete D only\
  \ if DIRECTLY >T to a retained doc, SemDeDup-style) + complete-linkage -> effect\
  \ must drop ~0. ROBUSTNESS: exact-Jaccard edges AND LSH edges (effect persists w/\
  \ exact => not an LSH-FP artifact). Sweep T + density; REPORT THE REALISTIC-DENSITY\
  \ OPERATING POINT (guard: not just nonzero at extreme density). Anti-circular: GT\
  \ never read by the pipeline. HONEST-NEGATIVE: if realistic density yields ~0 innocent\
  \ removals OR the non-transitive mitigation doesn't change anything -> falsified.\
  \ RESIDUAL killer-#6 FLAG (MODERATE, isolated to L1): real web graphs may be clique-like\
  \ at T~0.8 -> small innocent-removal; the structural core is settled regardless.\
  \ Topic: data-systems-for-ml. L1: real google-research/deduplicate-text-datasets\
  \ NearDup (5-grams, Lee2021 b/r bands) on a C4/RedPajama/Stack slice -> innocent-removal\
  \ fraction (exact-Jaccard removed-vs-retained-reps) connected-components vs SemDeDup\
  \ vs complete-linkage + downstream small-LM diversity/eval-loss on equal-token-budget\
  \ corpora."
