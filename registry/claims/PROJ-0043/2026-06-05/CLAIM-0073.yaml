claim: 'In DuckDB >=1.x (v1.5.3, young: v1.0 June 2024, real adoption: pandas-adjacent/dbt/MotherDuck/Observable/duckplyr),
  read_csv with all defaults sniffs a columns type from only the first sample_size
  (=20480) rows; a column whose sampled rows are integer-valued is locked to BIGINT,
  and any LATER fractional value is SILENTLY TRUNCATED to an integer (no error, no
  NULL, no warning, no re-widen) -- while a non-numeric value in the same column errors
  LOUDLY. The default sample_size silently sets a DATA-FIDELITY correctness property
  neither the sniffers authors (who promise loud errors: "if any structural errors
  are encountered, the scanner will immediately stop and throw the error") nor the
  user (who sees a clean load) predict. VERIFIED on devvm14382 (DuckDB 1.5.3 via pip):
  value 3.14 at row 30000 (past sample_size=20480) loaded as 3, dtype=BIGINT, zero
  diagnostic; same 3.14 at row 5 (inside sample) -> sniffs DOUBLE, preserves 3.14;
  sample_size=-1 (full scan) -> DOUBLE, preserved; pandas full-file read -> float64,
  preserved. The LOUD-vs-SILENT asymmetry by value TYPE (non-numeric -> loud error;
  fractional -> silent truncation) is the un-owned composition. NULL EXIT: DuckDB
  errors or preserves (pandas lineage) -> did NOT happen (silent truncation).'
