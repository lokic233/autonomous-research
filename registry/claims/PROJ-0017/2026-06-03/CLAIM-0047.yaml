claim: In long-horizon agentic rollouts whose per-step failure hazard is path-dependent
  and RISING after a deviation (an agent that drifts off the canonical path becomes
  monotonically more failure-prone the longer it stays off-path), the token-cost-optimal
  recovery policy is to roll back PAST the last checkpoint to before the inferred
  deviation onset, and a Young/Daly-style 'restart from the most recent checkpoint'
  policy (optimal under memoryless failures) incurs >=25% more expected wasted tokens
  because restarting inside a still-elevated-hazard region re-fails at a high rate;
  the size of this penalty grows monotonically with the hazard-rise steepness and
  is ZERO when the hazard is memoryless.
why_it_matters: "FRESH AREA (agentic-systems: recovery policy). EMPIRICAL-phenomenon\
  \ / policy-cost archetype, NO closed form in the non-memoryless regime (optimal\
  \ rollback DEPTH depends jointly on realized deviation-onset distribution + hazard-rise\
  \ shape + checkpoint spacing; the policy must INFER an unobserved latent onset \u2014\
  \ a sim must SEARCH policies under a stochastic process, cannot re-derive algebraically).\
  \ Screened vs 3 anti-patterns: NOT tuned-knob (both policies are FIXED rules given\
  \ the failure process, neither an adaptive-vs-tuned baseline); NOT KV-reuse; NOT\
  \ relabeling-vs-logprob. NOT metric-validity (headline = a POLICY-COST/wasted-token\
  \ result of a recovery decision, no scalar metric being indicted). NOT a forces-crossover\
  \ (single dominant mechanism: elevated post-restart hazard wastes re-execution).\
  \ Built-in CALIBRATION CONTROL: at alpha=0 (memoryless) the claim predicts ZERO\
  \ penalty (Young/Daly IS optimal there) \u2014 guards against a buggy sim manufacturing\
  \ a spurious gap. Falsifiable: Monte-Carlo (serial 1e4-1e5 rollouts) expected wasted\
  \ tokens for (A) memoryless-optimal restart-from-last-ckpt vs (B) deviation-aware\
  \ rollback-past-ckpt; sweep hazard-rise steepness alpha incl alpha=0. HONEST-NEGATIVE\
  \ (informative): if alpha=0 penalty~0 BUT realistic alpha>0 penalty stays <25% OR\
  \ not monotone in alpha, FALSIFIED -> 'HPC-inherited restart already near-optimal\
  \ for agent token-economics' (directly useful negative for agent-framework designers).\
  \ Anti-circular: GT = true latent deviation-onset step + hazard process (simulator-known,\
  \ policy-HIDDEN); tested signal = policy OBSERVABLE only (step failure events +\
  \ checkpoint positions, via noisy detector calibrated FPR/FNR or fixed overshoot\
  \ heuristic) \u2014 policy never sees on_path/true onset, GT scores it. Topic: agentic-systems.\
  \ PRIOR-ART (precise): HPC ckpt theory (Young1974/Daly2006/Benoit FGCS2024) assumes\
  \ EXPONENTIAL/memoryless fail-stop + optimizes ckpt INTERVAL (under memoryless,\
  \ recovery DEPTH is trivial \u2014 restart anywhere is equal) \u2014 I attack recovery-DEPTH\
  \ under NON-memoryless rising hazard the HPC corpus excludes by assumption; agent-drift\
  \ (2602.19008 canonical-path-deviation, 2502.05227 RoboTouille repeat-mistake, 2509.02360\
  \ PRM course-correct) establishes rising hazard but NONE -> rollback-depth policy/cost;\
  \ agent rollback (2503.11951 SagaLLM transactional, 2604.09718 rerun cost, 2604.22820,\
  \ 2604.23581) never derives cost-optimal DEPTH under rising hazard. Delta = first\
  \ to show memoryless-optimal restart is systematically wasteful precisely in the\
  \ empirically-established path-dependent-rising agent regime + optimal depth must\
  \ OVERSHOOT the last checkpoint. L1: fit empirical post-deviation hazard from real\
  \ long-horizon traces (SWE-bench/GAIA/RoboTouille) + verify deviation-aware rollback\
  \ (LLM/PRM noisy onset detector) reduces real wasted-token cost vs restart-from-last-ckpt\
  \ on production-style frameworks (LangGraph/AgentCore checkpointing)."
