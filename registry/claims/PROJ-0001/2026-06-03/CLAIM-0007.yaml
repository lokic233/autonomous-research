negative_evidence:
- exp_id: EXP-0009
  summary: 'NEGATIVE: CDC KV-dedup does NOT beat exact-prefix once RoPE position-dependence
    is accounted for. In offset-shifted multi-tenant agent prompts, token-level CDC
    reclaims 4-7% of KV blocks beyond exact-prefix (which captures ~0% under shift),
    BUT position-aware reclaim (same-absolute-position, required for raw-KV equality
    under RoPE) collapses to 0.35-1.46%; only 0-7% of CDC dup-tokens share absolute
    offset. Position-dependence is the crux and largely kills the claim''s core mechanism
    (dedup same schema at different offsets). GPU follow-up: test cheap re-rope transform
    that could revive to PARTIAL.'
