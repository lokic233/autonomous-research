academic_map_nodes: []
supporting_evidence:
- exp_id: EXP-0016
  summary: "L1 REAL-BENCHMARK validation of YELLOW L0 (VERDICT-0013); SUPPORTS+strengthens\
    \ the L0 weaken with real data. GOT REAL DATA: BFCL v4 (Berkeley Function-Calling\
    \ Leaderboard), official Gorilla repo, fetched live via fwdproxy on devgpu014.\
    \ The load-bearing unknown (real dependency-detector FNR e) is RESOLVED and NOT\
    \ safe. M1 real f_indep: BFCL parallel categories definitionally 100pct independent\
    \ (curated ceiling; vs L0 constructed 0.44-0.71 mixed corpus). M2 THE ANSWER:\
    \ real e measured on 257 real multi_turn DAGs (668 calls) vs 3 detectors: heuristic\
    \ data-flow e=0.58, data-flow+state e=0.16, LLM Qwen2.5-1.5B e=0.61 \u2014 ALL\
    \ >> 0.025 safety threshold and >= L0 assumed 0.05. e dominated by STATEFUL/ORDER\
    \ deps (FNR 0.27-0.97) not value data-flow (FNR 0.00-0.30) \u2014 real-data refinement\
    \ L0 could not see. M3 empirical f_wrong 2.4-8.5pct/call validates L0 binomial\
    \ 1-(1-e)^k (modeled 0.074 vs empirical 0.024-0.085). M4 LLMCompiler (2312.04511):\
    \ +9pct acc / 3.7x latency vs ReAct because it PLANS explicit DAG (var refs) not\
    \ post-hoc detection \u2014 sidesteps e wall, explains why detect-then-parallelize\
    \ fails. VERDICT: HELD/strengthened weaken; free-latency-win refuted on real stateful\
    \ agentic traces; naive detect-then-parallelize unsafe, plan-time DAG construction\
    \ required. Caveats: parallel-cat f_indep=1.0 curated ceiling; heuristic data-class\
    \ recall circular (use LLM 0.70); small 1.5B LLM judge. No detector reached e<=0.025."
  data_path: experiments/2026-06-03/EXP-0016/
negative_evidence:
- exp_id: EXP-0014
  summary: 'PARTIAL verdict -> WEAKEN. Part A (independent-call fraction >30%) HELD
    robustly: f_indep|multicall 0.44-0.71 across ALL mixes incl pessimistic seq-heavy;
    exploitable width>=2 fraction 0.19(seq)-0.85(fanout), 0.55 balanced -> strongly
    mix-dependent. Part B (correctness-safety, the ''FREE/safe'' qualifier) FAILED
    pre-registered bar: at realistic dependency-detector false-negative rate e=0.05,
    ~10-12% of parallelized steps corrupted (>5% threshold); f_wrong scales ~linearly
    with e, worse in parallelism-rich mixes; f_wrong=0 only at perfect detector e=0.
    Latency headroom 1.4x(hetero)-1.7x(eqlat) balanced. CONSTRUCTED ReAct-archetype
    corpus w/ ground-truth DAGs, mix-conditional, NOT a population statistic. 5 seeds,
    4000 steps/seed, SERIAL ~2.2s. Claim as stated (''free latency win'') NOT held:
    the win is CONTINGENT on a near-perfect (e<=0.025) detector, an open L1 question.
    Prior art LLMCompiler/ReWOO/AsyncLM/parallel-fn-calling distinguished (novelty
    = empirical parallelism+correctness-safety bound, not the mechanism). WEAKEN:
    parallelism is real but ''free latency win'' framing refuted at realistic detection
    error.'
  data_path: experiments/2026-06-03/EXP-0014/
