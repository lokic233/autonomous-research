claim: "In multi-step LLM agent trajectories that ultimately FAIL, the failure is\
  \ foreshadowed by a CAUSAL, online-observable signature (e.g. rising tool-error/retry\
  \ rate, repeated near-identical actions = looping, declining new-information-per-step)\
  \ that a cheap monitor can detect to flag the trajectory as doomed STRICTLY EARLIER\
  \ (>=N steps before) than the agent's own termination/error \u2014 AND this early-warning\
  \ signal beats BOTH (a) the agent's own self-reported confidence and (b) a generic\
  \ per-trajectory difficulty predictor, because impending agentic failure has a structural\
  \ progression signature distinct from intrinsic task difficulty."
why_it_matters: "FRESH axis (agentic failure-attribution / early-warning \u2014 untouched\
  \ by the 20 prior claims) AND deliberately NOT a Jensen-floor tuned-knob nor a RoPE-wall\
  \ KV-reuse play (the 2 anti-patterns). It's a CHARACTERIZATION contribution: (1)\
  \ is there a causal online failure signature with usable LEAD TIME? (2) does it\
  \ beat the agent's self-confidence AND a generic difficulty predictor (anti-relabeling,\
  \ the lesson from CLAIM-0015)? L0: model/trace agent trajectories with a LATENT\
  \ failure process, a CAUSAL monitor reading only online observables (NOT the latent\
  \ failure label), measure lead-time + AUC vs self-confidence + generic-difficulty\
  \ baselines; honest-negative if no lead time OR it's just relabeling difficulty\
  \ OR needs oracle. Topic: agentic-systems. Distinguish from agent-failure-attribution\
  \ / LLM-as-judge post-hoc analysis (those are POST-hoc; novelty is the EARLY online\
  \ causal signature with measured lead time)."
