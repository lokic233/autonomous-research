- exp_id: EXP-0033
  summary: 'WEAKEN (partial-negative). Online causal failure-foreshadow monitor (tool-err/loop/info-gain
    EWMA) BEATS generic-difficulty predictor (AUC delta +0.095, 95%CI[+0.087,+0.103],
    96/96 seeds positive) AND has real lead time (median +2.32 steps before agent
    termination) -> passes the anti-relabeling test that killed CLAIM-0015. BUT FAILS
    to beat agent self-confidence (AUC delta -0.006, 95%CI[-0.011,-0.001]). Claim
    required beating BOTH baselines -> strong claim FALSIFIED. Anti-circular OK: monitor
    0.743 < latent-health oracle 0.858 (gap .115). Caveat: modeled self-confidence
    is a privileged direct (noisy) health readout; real LLM confidence is often miscalibrated
    -> L1 on tau-bench/AppWorld/SWE-agent real traces could flip the self-confidence
    comparison. Surviving weak form: failure has a progression signature distinct
    from intrinsic difficulty with usable lead time.'
  data_path: experiments/2026-06-03/EXP-0033/
- exp_id: EXP-0034
  summary: 'CONVERGE/RED: sigma_conf flip-point=0.50 (monitor beats self-confidence
    only once conf-AUC drops below ~0.72; reproduces EXP-0033 at sigma=0.35 d=-0.006).
    Flip IS within realistic VERBALIZED-confidence ranges (AUROC 0.5-0.7 per 2602.06948,
    clinical PubMed 40378406, 2601.07264), so on that axis claim looked L1-worthy.
    BUT prior-art kill: online stepwise failure detection on multi-step agent trajectories
    is ALREADY PUBLISHED (Mavi et al 2511.07364, AUC~0.9 step-by-step self-eval; Vasudev
    et al 2602.03338 critic AUROC 0.94; PRMs/AgentBoard adjacent). At that strong
    online-self-eval calibration (sigma_conf << flip) OUR model says monitor LOSES.
    Surviving lead-time novelty unsupported even at L0 (EXP-0033 42% coverage < 0.5
    bar). Only robust win (distinct-from-difficulty +0.095) is least-novel half, implicit
    in PRM/progress-rate work. Pre-reg decision rule ELSE branch fires: strong claim
    is RELABELING. Recommend RED. Cheap L0 avoided a wasted GPU L1.'
  data_path: experiments/2026-06-03/EXP-0034/
