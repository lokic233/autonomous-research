claim: 'A storage/ingestion teams per-shard df[col].astype("category") (a compression
  decision) silently fixes the integer mapping that a downstream feature team consumes
  via .cat.codes -- and because the cast sorts ONLY THE OBSERVED values per shard,
  every category that co-occurs across two shards with DIFFERENT observed-category
  subsets gets a DIFFERENT integer code (measured 30/30 = 100% of common categories
  differ), collapsing a tree models R^2 on overlapping categories from 0.957 (fixed
  global map) to -0.583 (per-shard .cat.codes), delta~1.54 -- worse than the mean
  predictor on categories it was trained on, with ZERO error raised. pyarrow.dictionary_encode()
  uses first-seen (arrival) order (also unstable across shards) and round-trips that
  into pandas .cat.codes, an independent divergence source. NULL EXIT: if every shard
  observes the FULL category alphabet, codes are stable and delta R^2 -> 0 (the honest
  boundary -- the claim is CONDITIONAL on partial observation, the common case in
  time/geo-partitioned/streaming sharded ingestion; a single-file pipeline is immune).'
why_it_matters: "Cross-area production-seam (data-systems/storage-encoding-semantics\
  \ x feature-contract), FIRST-GREEN (CLAIM-0059) shape, GENUINELY ORTHOGONAL to every\
  \ dead vein + to scout-Ns fp16-dtype-x-stats angle (this is encoding-SEMANTICS x\
  \ feature-contract, NO statistic involved). \u2605 CLEARS incremental-composition:\
  \ NEITHER endpoint predicts the outcome from its OWN side. A (ingestion): \"category\
  \ is lossless compression, the string VALUES round-trip identically\" -- TRUE, and\
  \ A never produced an INTEGER so has no reason to think it set any integer contract.\
  \ B (ML): \".cat.codes is a standard stable label encoding\" -- TRUE WITHIN ONE\
  \ FILE; crucially B never FITS an encoder, so the usual fit-on-train/transform-on-serve\
  \ discipline NEVER EVEN FIRES (no encoder object to misuse) -- the integer contract\
  \ was set INVISIBLY by As storage cast, and B assumes stability because it IS stable\
  \ within any single file. The catastrophic skew lives ONLY in A-per-shard-sorting\
  \ x B-per-shard-.cat.codes x partial-observation (not every shard sees every category);\
  \ no single owner sees all three. \u2605 VERIFY-THE-COMPOSITION applied (CLAIM-0065\
  \ lesson): scouts FIRST intuition (arrival-order instability) was FALSIFIED by probe\
  \ (astype category SORTS -> equal-alphabet shards give identical codes); the REAL\
  \ mechanism (partial-observation shifts the sort) was verified end-to-end through\
  \ parquet write->read on a 50-cat partitioned dataset (100% common codes differ);\
  \ pyarrow-dict-encode first-seen-order path verified as a 2nd arm. Prior-art: sklearn\
  \ LabelEncoder/OrdinalEncoder teach fit-on-train/transform-on-serve but that targets\
  \ ENCODER OBJECTS; .cat.codes is a DTYPE PROPERTY set by the storage layer so the\
  \ guidance never engages; no pandas doc warns astype-category codes are observation-subset-dependent\
  \ across files. Active leakage lit (Kapoor-Narayanan 2023, fit-before-split, target-encoding\
  \ leakage) is train/test CONTAMINATION within ONE dataset -- this is cross-shard\
  \ storage x feature train/serve SKEW with NO fitted estimator -> orthogonal, NOT\
  \ in those clusters. Public-measurable (Criteo/NYC-taxi/any partitioned-parquet\
  \ categorical), version-current (pandas 2.3.3/pyarrow 21.0.0, documented-default\
  \ sorting = stable). L0 already shows R^2 0.957->-0.583 with a clean fixed-global-map\
  \ control. HONEST RISK: requires shards with differing observed subsets (common\
  \ in time/geo partitioning; single-file immune) -> claim must STATE this condition;\
  \ reviewer \"just fit an encoder\" -> rebuttal = .cat.codes BYPASSES the fit step,\
  \ the storage cast made it LOOK like a free stable encoding so the discipline is\
  \ never invoked = exactly the undocumented trap. Scout-O GREEN-eligible."
