claim: 'In fjall (fjall-rs/fjall v3.1.4, young Rust LSM embedded KV, real adoption:
  brk Bitcoin Research Kit + atproto/Bluesky tooling; no Jepsen/CVE/crash-consistency
  paper exists), journal corruption that destroys batch FRAMING (a torn/lost write
  or out-of-order page writeback that removes an End marker -- the natural signature
  of the DEFAULT PersistMode::Buffer) is silently treated as an incomplete trailing
  batch: the DB OPENS SUCCESSFULLY WITH NO ERROR while silently DISCARDING ALL PersistMode::SyncAll-ACKNOWLEDGED
  committed data written after the corruption point -- WHEREAS in-DATA corruption
  (same byte budget, inside a value) is caught by the per-batch xxh3 checksum and
  surfaced as a loud Err(JournalRecovery(ChecksumMismatch)). WHERE the corruption
  lands (framing vs data), not how much, decides loud-fail vs silent-loss. VERIFIED
  on devvm14382 fjall 3.1.4 (50 SyncAll-acknowledged keys, corrupt journal, reopen):
  data_flip control (1 byte inside a value) -> open_ok=FALSE, loud ChecksumMismatch
  (the NULL outcome, proves the discriminator); trailing torn-last-batch -> open_ok=true
  49/50 (correct); mid_truncate -> open_ok=true 25/50 SILENT; mid_zero (out-of-order
  writeback, later batches intact) -> 16/50 SILENT; mid_flip (spurious mid-stream
  Start) -> 12/50 SILENT; early_trunc -> 1/50 SILENT. Mechanism: JournalBatchReader
  on a framing desync -> truncate_to(last_valid_pos)+return None -> iterator ends
  -> recovery for-loop ends NORMALLY -> clean open, post-corruption batches gone,
  truncation only log::debug/trace (no error path); on checksum mismatch -> loud Err.
  NULL EXIT: open fails loudly OR all 50 keys present -> did NOT happen on framing
  corruption. NOVELTY = the LOUD-vs-SILENT recovery ASYMMETRY by corruption LOCATION
  under the default durability mode + clean-open-no-error (fjall-specific, un-owned),
  NOT generic "WALs lose data after a hole".'
