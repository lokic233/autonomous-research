- exp_id: EXP-0020
  summary: 'PARTIAL. CLAIM-0015 quant-sensitivity PRE-decode router (L0 sim). (A)
    Per-request quant-degradation IS predictable from cheap PRE-decode features (ppl/domain/arith/longctx)
    when degradation is request-dependent/heavy-tailed: AUC 0.77-0.89 at realistic
    noise, ~0.52 (chance) in uniform-null regime. Anti-circular: predictor never reads
    latent cause s_i; oracle gap 0.02-0.03 quality. (B) Router DOMINATES all-quant/all-full/random
    on cost/quality Pareto, but vs STRONG confidence-threshold cascade @matched budget:
    CI-positive only at sigma>=0.3 (+0.7-2.4% quality), TIES (CI includes 0) at sigma=0.15.
    Verdict PARTIAL: predictability+weak-baseline dominance HELD, confidence-threshold
    edge CONDITIONAL on pre-vs-post-decode signal noise. Real edge is COST (skips
    cheap decode) not quality. Prior art (FrugalGPT/RouteLLM/hybrid-precision serving)
    published; only candidate novelty = quant-sensitivity-specific pre-decode prediction.'
  data_path: experiments/2026-06-03/EXP-0020/
- exp_id: EXP-0022
  summary: 'researcher-gpu-0022 completed all compute + RESULTS.md but stalled before
    exp-complete; orchestrator finalized from on-node results. RELABELING/weaken:
    real quant-degradation IS heavy-tailed (survives) BUT predictive signal is DOMAIN/generic-difficulty
    not quant-specific (within-domain ppl at chance); generic difficulty router matches
    it (+0.025 AUC); skip-cheap-decode cost-win negative (prefill dominates); confidence
    cascade competitive. Novelty collapses to relabeling.'
  data_path: experiments/2026-06-03/EXP-0022/
- exp_id: EXP-0022
  summary: 'L1 REAL quant-degradation (Qwen2.5-1.5B fp16 vs bnb-NF4-4bit, 160 real
    prompts: GSM8K/CoQA/general). (1) Degradation IS heavy-tailed/request-dependent
    NOT uniform (objective-ref n=120: kurtosis +3.28, gini 0.833; 79% no-change, 12.5%
    degrade >0.5) -> the load-bearing assumption committee#1 flagged SURVIVES. BUT:
    (2) within-domain prompt-perplexity AUC predicting degradation is at CHANCE (arith
    0.591, longqa 0.456); the 0.838 full-feature AUC is carried entirely by the DOMAIN
    TAG. (3) A generic difficulty router matches the quant-sensitivity router (+0.025
    AUC, negligible) -> NOVELTY COLLAPSES TO RELABELING. (4) skip-cheap-decode cost-win
    is NEGATIVE at measured prompt:decode ratios (prefill=71.6% of a quant pass, dominates
    71-tok decode; rerouting costs +5.5e11 FLOPs net). (5) real confidence cascade
    competitive at true cost. VERDICT: relabeling/weaken - novel quant-specific contribution
    unsupported; only revival paths are long-generation workloads or a 7B-AWQ pair.
    Caveat: NF4 not AWQ/GPTQ, 1.5B small. ~11min GPU. Artifacts devgpu014:/home/dengcchi/ros-EXP-0022
    + Mac experiments/2026-06-03/EXP-0022.'
  data_path: experiments/2026-06-03/EXP-0022/
