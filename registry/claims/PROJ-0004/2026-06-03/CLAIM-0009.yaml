  \ at matched quality. Topic: inference-optimization. L0: model layer-wise confidence\
  \ by token class on agent traces; structure-aware vs global threshold FLOP-vs-quality.\
  \ NOVELTY RISK: early-exit/CALM/depth-adaptive is published \u2014 must isolate\
  \ the agentic-structure-conditioned threshold + show it beats a tuned global threshold\
  \ (the EXP-0006 lesson)."
